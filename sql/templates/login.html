<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Syne:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d0d;
      --paper: #f5f0e8;
      --accent: #b84a32;
      --muted: #a09888;
      --line: #d8d0c4;
    }

    body {
      min-height: 100vh;
      background-color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.5;
    }

    /* Decorative lines */
    .deco-line {
      position: fixed;
      background: var(--line);
    }
    .deco-line.h { height: 1px; width: 100vw; left: 0; }
    .deco-line.v { width: 1px; height: 100vh; top: 0; }
    .deco-line.top { top: 3rem; }
    .deco-line.bottom { bottom: 3rem; }
    .deco-line.left { left: 3rem; }
    .deco-line.right { right: 3rem; }

    /* Corner marks */
    .corner {
      position: fixed;
      width: 18px;
      height: 18px;
      border-color: var(--muted);
      border-style: solid;
    }
    .corner.tl { top: 1.5rem; left: 1.5rem; border-width: 1px 0 0 1px; }
    .corner.tr { top: 1.5rem; right: 1.5rem; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 1.5rem; left: 1.5rem; border-width: 0 0 1px 1px; }
    .corner.br { bottom: 1.5rem; right: 1.5rem; border-width: 0 1px 1px 0; }

    /* Card */
    .card {
      position: relative;
      width: 420px;
      padding: 3.5rem 3.5rem 3rem;
      background: var(--paper);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Vertical accent bar */
    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 3.5rem;
      bottom: 3rem;
      width: 2px;
      background: var(--accent);
    }

    .eyebrow {
      font-family: 'Syne', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 3rem;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 2.5rem;
      animation: fadeUp 0.8s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .field {
      margin-bottom: 1.6rem;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .field:nth-of-type(1) { animation-delay: 0.2s; }
    .field:nth-of-type(2) { animation-delay: 0.25s; }

    label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 0.5rem 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.3s ease;
    }

    input::placeholder { color: var(--line); }

    input:focus {
      border-bottom-color: var(--accent);
    }

    .input-line {
      position: relative;
    }
    .input-line::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      height: 1px;
      width: 0;
      background: var(--accent);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .input-line:focus-within::after { width: 100%; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2.5rem;
      animation: fadeUp 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    button {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--paper);
      background: var(--ink);
      border: none;
      padding: 0.85rem 2rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    button:hover::after { transform: translateX(0); }

    button span {
      position: relative;
      z-index: 1;
    }

    .link {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1px;
      transition: color 0.3s, border-color 0.3s;
    }
    .link:hover { color: var(--accent); border-color: var(--accent); }

    /* Issue number stamp */
    .stamp {
      position: fixed;
      bottom: 1.8rem;
      right: 5rem;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
    }
  </style>
</head>
<body>

  <div class="deco-line h top"></div>
  <div class="deco-line h bottom"></div>
  <div class="deco-line v left"></div>
  <div class="deco-line v right"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="stamp">Session / 01</div>

  <div class="card">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign<br><em>in.</em></h1>

   <form action="/login" method="POST">
  <div class="field">
    <label for="username">Username</label>
    <div class="input-line">
      <input type="text" id="username" name="username" placeholder="your handle" autocomplete="off" />
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-line">
      <input type="password" id="password" name="password" placeholder="••••••••" />
    </div>
  </div>

  <div class="row">
    <button type="submit">
      <span>Enter &rarr;</span>
    </button>
    <a href="#" class="link">Forgot?</a>
  </div>
</form>
  <script>
    function handleLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (!u || !p) {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(i => {
          if (!i.value) {
            i.style.borderBottomColor = '#b84a32';
            i.addEventListener('input', () => i.style.borderBottomColor = '', { once: true });
          }
        });
        return;
      }
      // Submit logic here
      console.log('Username:', u);
    }
  </script>
</body>
</html>
